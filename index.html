<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Digitale Platenkast</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .platenkast {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
            background-color: #2d251e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .album-kaart {
            text-align: center;
            cursor: pointer;
        }

        /* Flip-effect */
        .flip-container {
            perspective: 1000px;
        }

        .flipper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .flip-container:hover .flipper {
            transform: rotateY(180deg);
        }

        .hoes {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 4px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .achterkant {
            transform: rotateY(180deg);
        }

        .titel {
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .artiest {
            color: #b3b3b3;
            font-size: 0.9em;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<h1>🎵 Mijn LP Collectie</h1>

<div class="platenkast">

    <!-- ABBEY ROAD -->
    <div class="album-kaart">
        <div class="flip-container">
            <div class="flipper">
                <img class="hoes voorkant" src="https://i.imgur.com/UMxQZ8F.jpeg" alt="Abbey Road voorkant">
                <img class="hoes achterkant" src="https://i.imgur.com/4ZQmQ8T.jpeg" alt="Abbey Road achterkant">
            </div>
        </div>
        <div class="titel">Abbey Road</div>
        <div class="artiest">The Beatles (1969)</div>
    </div>

    <!-- DARK SIDE OF THE MOON -->
    <div class="album-kaart">
        <div class="flip-container">
            <div class="flipper">
                <img class="hoes voorkant" src="https://i.imgur.com/8lQqK5F.jpeg" alt="Dark Side voorkant">
                <img class="hoes achterkant" src="https://i.imgur.com/9m3Q2mF.jpeg" alt="Dark Side achterkant">
            </div>
        </div>
        <div class="titel">The Dark Side of the Moon</div>
        <div class="artiest">Pink Floyd (1973)</div>
    </div>

    <!-- THRILLER -->
    <div class="album-kaart">
        <div class="flip-container">
            <div class="flipper">
                <img class="hoes voorkant" src="https://i.imgur.com/1bX5QH6.jpeg" alt="Thriller voorkant">
                <img class="hoes achterkant" src="https://i.imgur.com/2tYpQ8F.jpeg" alt="Thriller achterkant">
            </div>
        </div>
        <div class="titel">Thriller</div>
        <div class="artiest">Michael Jackson (1982)</div>
    </div>

</div>

</body>
</html>
