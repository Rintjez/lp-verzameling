<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Digitale Platenkast</title>

<style>
    body {
        background-color: #1e1e1e;
        color: #f5f5f5;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 { text-align: center; }

    /* MENU */
    .menu {
        background: #333;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .menu button {
        margin-right: 10px;
        padding: 10px 15px;
        border: none;
        background: #555;
        color: white;
        cursor: pointer;
        border-radius: 4px;
    }

    .menu button:hover { background: #777; }

    /* FORMULIEREN */
    .form {
        display: none;
        background: #2d2d2d;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .form input, .form select {
        width: 100%;
        padding: 8px;
        margin: 6px 0;
        border-radius: 4px;
        border: none;
    }

    .form button {
        margin-top: 10px;
        padding: 10px;
        width: 100%;
        background: #444;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    /* ZOEKFUNCTIE */
    #searchBox {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
    }

    /* GROTE VIEWER */
    #viewer {
        width: 350px;
        margin: 20px auto;
        text-align: center;
        display: none;
    }

    #viewer img {
        width: 100%;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #viewer button {
        margin: 10px 5px;
        padding: 10px 15px;
        background: #444;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #viewer button:hover { background: #666; }

    /* PLATENKAST */
    .platenkast {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .album-kaart {
        text-align: center;
        cursor: pointer;
    }

    .album-kaart img {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
        border-radius: 4px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .titel { margin-top: 8px; font-weight: bold; }
    .artiest { font-size: 0.9em; color: #bbb; }
</style>
</head>
<body>

<h1>🎵 Mijn LP Collectie</h1>

<!-- MENU -->
<div class="menu">
    <button onclick="showAddForm()">LP toevoegen</button>
    <button onclick="showRemoveForm()">LP verwijderen</button>
</div>

<!-- ZOEKFUNCTIE -->
<input id="searchBox" placeholder="Zoek op titel of artiest..." onkeyup="searchLPs()">

<!-- GROTE VIEWER -->
<div id="viewer">
    <img id="viewerImg" src="">
    <div>
        <button onclick="showFront()">Voorkant</button>
        <button onclick="showBack()">Achterkant</button>
        <button onclick="closeViewer()">Sluiten</button>
    </div>
</div>

<!-- LP TOEVOEGEN -->
<div id="addForm" class="form">
    <h3>Nieuwe LP toevoegen</h3>
    <input id="titel" placeholder="Titel van album">
    <input id="artiest" placeholder="Artiest (jaar)">
    <input id="front" placeholder="Bestandsnaam voorkant (bijv. nieuwlp-front.jpg)">
    <input id="back" placeholder="Bestandsnaam achterkant (bijv. nieuwlp-back.jpg)">
    <button onclick="addLP()">Toevoegen</button>
</div>

<!-- LP VERWIJDEREN -->
<div id="removeForm" class="form">
    <h3>LP verwijderen</h3>
    <select id="removeSelect"></select>
    <button onclick="removeLP()">Verwijderen</button>
</div>

<!-- PLATENKAST -->
<div id="platenkast" class="platenkast"></div>

<script>
    let albums = [
        { titel: "Abbey Road", artiest: "The Beatles (1969)", front: "abbeyroad-front.jpg", back: "abbeyroad-back.jpg" },
        { titel: "The Dark Side of the Moon", artiest: "Pink Floyd (1973)", front: "darkside-front.jpg", back: "darkside-back.jpg" },
        { titel: "Thriller", artiest: "Michael Jackson (1982)", front: "thriller-front.jpg", back: "thriller-back.jpg" }
    ];

    let currentFront = "";
    let currentBack = "";

    function renderAlbums(filtered = null) {
        const kast = document.getElementById("platenkast");
        kast.innerHTML = "";

        const list = filtered || albums;

        list.forEach((album, index) => {
            kast.innerHTML += `
                <div class="album-kaart" onclick="openViewer('${album.front}', '${album.back}')">
                    <img src="${album.front}">
                    <div class="titel">${album.titel}</div>
                    <div class="artiest">${album.artiest}</div>
                </div>
            `;
        });

        updateRemoveList();
    }

    function updateRemoveList() {
        const select = document.getElementById("removeSelect");
        select.innerHTML = "";
        albums.forEach((album, index) => {
            select.innerHTML += `<option value="${index}">${album.titel}</option>`;
        });
    }

    function showAddForm() {
        document.getElementById("addForm").style.display = "block";
        document.getElementById("removeForm").style.display = "none";
    }

    function showRemoveForm() {
        document.getElementById("removeForm").style.display = "block";
        document.getElementById("addForm").style.display = "none";
    }

    function addLP() {
        const titel = document.getElementById("titel").value;
        const artiest = document.getElementById("artiest").value;
        const front = document.getElementById("front").value;
        const back = document.getElementById("back").value;

        albums.push({ titel, artiest, front, back });
        renderAlbums();
    }

    function removeLP() {
        const index = document.getElementById("removeSelect").value;
        albums.splice(index, 1);
        renderAlbums();
    }

    function searchLPs() {
        const q = document.getElementById("searchBox").value.toLowerCase();

        const filtered = albums.filter(album =>
            album.titel.toLowerCase().includes(q) ||
            album.artiest.toLowerCase().includes(q)
        );

        renderAlbums(filtered);
    }

    function openViewer(front, back) {
        currentFront = front;
        currentBack = back;

        document.getElementById("viewerImg").src = front;
        document.getElementById("viewer").style.display = "block";
        window.scrollTo(0, 0);
    }

    function showFront() {
        document.getElementById("viewerImg").src = currentFront;
    }

    function showBack() {
        document.getElementById("viewerImg").src = currentBack;
    }

    function closeViewer() {
        document.getElementById("viewer").style.display = "none";
    }

    renderAlbums();
</script>

</body>
</html>
