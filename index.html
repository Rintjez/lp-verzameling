<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Digitale Platenkast</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-blur: blur(12px);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #1db954; /* Spotify Groen */
            --accent-hover: #1ed760;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --plank-bg: linear-gradient(to bottom, #4a3319, #2f1f0e);
            --plank-shadow: 0 16px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        
        /* MENU */
        .menu {
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 14px;
            margin-bottom: 35px;
            display: flex;
            gap: 10px;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .menu button {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        
        /* FORMULIEREN */
        .form {
            display: none;
            background: rgba(20, 30, 40, 0.75);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 16px;
            margin: 0 auto 35px auto;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .form h3 {
            margin-top: 0;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .form input, .form select {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0 18px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form input:focus, .form select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.2);
        }

        .form button {
            padding: 14px;
            width: 100%;
            background: var(--accent-color);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .form button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(29, 185, 84, 0.4);
        }
        
        /* ZOEKFUNCTIE */
        #searchBox {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 0 auto 40px auto;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        #searchBox:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            max-width: 540px;
            border-color: rgba(255,255,255,0.3);
        }
        
        /* GROTE VIEWER */
        #viewer {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 25, 35, 0.85);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: 20px;
            margin: 0 auto 40px auto;
            text-align: center;
            display: none;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        #viewer img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            transition: transform 0.5s ease;
        }

        .viewer-buttons {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        #viewer button {
            padding: 12px;
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        #viewer button:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.25);
        }

        #viewer button.spotify-btn {
            background: #1db954;
            color: black;
            border: none;
        }
        #viewer button.spotify-btn:hover { background: #1ed760; }

        #viewer button.youtube-btn {
            background: #ff0000;
            color: white;
            border: none;
        }
        #viewer button.youtube-btn:hover { background: #ff3333; }

        #viewer button.close-btn {
            grid-column: span 2;
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-decoration: underline;
            margin-top: 5px;
        }
        #viewer button.close-btn:hover { color: white; background: transparent; }
        
        /* PLANKEN & PLATENKAST */
        #platenkast {
            display: flex;
            flex-direction: column;
            gap: 55px;
            margin-top: 40px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .plank {
            display: flex;
            gap: 40px;
            padding: 25px 35px 15px 35px;
            background: var(--plank-bg);
            border-radius: 10px;
            box-shadow: var(--plank-shadow);
            border-bottom: 14px solid #1a110a;
            justify-content: flex-start;
            position: relative;
        }

        .album-kaart {
            text-align: center;
            cursor: pointer;
            width: 160px;
            position: relative;
            z-index: 2;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .album-kaart:hover {
            transform: translateY(-20px) scale(1.06);
        }

        .album-kaart img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: box-shadow 0.35s ease;
        }

        .album-kaart:hover img {
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .titel {
            margin-top: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artiest {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <h1>🎵 Mijn LP Collectie</h1>

    <!-- MENU -->
    <nav class="menu">
        <button onclick="showForm('addForm')">LP toevoegen</button>
        <button onclick="showForm('removeForm')">LP verwijderen</button>
        <button onclick="showForm('editForm')">LP wijzigen</button>
    </nav>

    <!-- ZOEKFUNCTIE -->
    <input id="searchBox" placeholder="Zoek een LP in je kast..." onkeyup="searchLPs()">

    <!-- GROTE VIEWER -->
    <section id="viewer">
        <img id="viewerImg" src="" alt="Geselecteerde LP hoes">
        <div class="viewer-buttons">
            <button onclick="showFront()">Voorkant</button>
            <button onclick="showBack()">Achterkant</button>
            <button class="spotify-btn" onclick="openSpotify()">Spotify</button>
            <button class="youtube-btn" onclick="openYouTube()">YouTube</button>
            <button class="close-btn" onclick="closeViewer()">Venster sluiten</button>
        </div>
    </section>

    <!-- LP TOEVOEGEN -->
    <div id="addForm" class="form">
        <h3>Nieuwe LP toevoegen</h3>
        <input id="titel" placeholder="Titel van album">
        <input id="artiest" placeholder="Artiest (jaar)">
        <input id="front" placeholder="Bestandsnaam voorkant (bijv. nieuwlp-front.jpg)">
        <input id="back" placeholder="Bestandsnaam achterkant (bijv. nieuwlp-back.jpg)">
        <input id="spotify" placeholder="Spotify link (optioneel)">
        <input id="youtube" placeholder="YouTube link (optioneel)">
        <button onclick="addLP()">Toevoegen</button>
    </div>

    <!-- LP VERWIJDEREN -->
    <div id="removeForm" class="form">
        <h3>LP verwijderen</h3>
        <select id="removeSelect"></select>
        <button onclick="removeLP()">Verwijderen</button>
    </div>

    <!-- LP WIJZIGEN -->
    <div id="editForm" class="form">
        <h3>LP wijzigen</h3>
        <select id="editSelect" onchange="loadEditFields()"></select>
        <input id="editTitel" placeholder="Nieuwe titel">
        <input id="editArtiest" placeholder="Nieuwe artiest (jaar)">
        <input id="editFront" placeholder="Nieuwe voorkant-bestandsnaam">
        <input id="editBack" placeholder="Nieuwe achterkant-bestandsnaam">
        <input id="editSpotify" placeholder="Nieuwe Spotify link">
        <input id="editYouTube" placeholder="Nieuwe YouTube link">
        <button onclick="editLP()">Opslaan</button>
    </div>

    <!-- PLATENKAST -->
    <main id="platenkast"></main>
    <script>
let albums = [
    {
        titel: "Abbey Road",
        artiest: "The Beatles (1969)",
        front: "abbeyroad-front.jpg",
        back: "abbeyroad-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    },
    {
        titel: "The Dark Side of the Moon",
        artiest: "Pink Floyd (1973)",
        front: "darkside-front.jpg",
        back: "darkside-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    },
    {
        titel: "Thriller",
        artiest: "Michael Jackson (1982)",
        front: "thriller-front.jpg",
        back: "thriller-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    }
];

let currentFront = "";
let currentBack = "";
let currentSpotify = "";
let currentYouTube = "";

function renderAlbums(filtered = null) {
    const kast = document.getElementById("platenkast");
    kast.innerHTML = "";
    const list = filtered || albums;

    for (let i = 0; i < list.length; i += 3) {
        let plank = document.createElement("div");
        plank.className = "plank";
        
        list.slice(i, i + 3).forEach(album => {
            plank.innerHTML += `
                <div class="album-kaart" onclick="openViewer('${album.front}', '${album.back}', '${album.spotify}', '${album.youtube}')">
                    <img src="${album.front}" alt="Hoes van ${album.titel}">
                    <div class="titel" title="${album.titel}">${album.titel}</div>
                    <div class="artiest" title="${album.artiest}">${album.artiest}</div>
                </div>
            `;
        });
        kast.appendChild(plank);
    }
    updateSelectLists();
}

function updateSelectLists() {
    const removeSel = document.getElementById("removeSelect");
    const editSel = document.getElementById("editSelect");
    removeSel.innerHTML = "";
    editSel.innerHTML = "";
    
    albums.forEach((album, index) => {
        removeSel.innerHTML += `<option value="${index}">${album.titel}</option>`;
        editSel.innerHTML += `<option value="${index}">${album.titel}</option>`;
    });
}

function showForm(formId) {
    hideForms();
    document.getElementById(formId).style.display = "block";
    if(formId === 'editForm') {
        loadEditFields();
    }
}

function hideForms() {
    document.getElementById("addForm").style.display = "none";
    document.getElementById("removeForm").style.display = "none";
    document.getElementById("editForm").style.display = "none";
}

function addLP() {
    const titelVal = document.getElementById("titel").value;
    const artiestVal = document.getElementById("artiest").value;
    const frontVal = document.getElementById("front").value;
    
    if(!titelVal || !artiestVal || !frontVal) {
        alert("Vul ten minste een titel, artiest en voorkant in!");
        return;
    }

    albums.push({
        titel: titelVal,
        artiest: artiestVal,
        front: frontVal,
        back: document.getElementById("back").value || frontVal,
        spotify: document.getElementById("spotify").value,
        youtube: document.getElementById("youtube").value
    });
    
    document.getElementById("titel").value = "";
    document.getElementById("artiest").value = "";
    document.getElementById("front").value = "";
    document.getElementById("back").value = "";
    document.getElementById("spotify").value = "";
    document.getElementById("youtube").value = "";
    
    hideForms();
    renderAlbums();
}

function removeLP() {
    const index = document.getElementById("removeSelect").value;
    if(index === "") return;
    
    albums.splice(index, 1);
    hideForms();
    renderAlbums();
}

function loadEditFields() {
    const index = document.getElementById("editSelect").value;
    if (index === "" || !albums[index]) return;
    
    const album = albums[index];
    document.getElementById("editTitel").value = album.titel;
    document.getElementById("editArtiest").value = album.artiest;
    document.getElementById("editFront").value = album.front;
    document.getElementById("editBack").value = album.back;
    document.getElementById("editSpotify").value = album.spotify;
    document.getElementById("editYouTube").value = album.youtube;
}

function editLP() {
    const index = document.getElementById("editSelect").value;
    if (index === "" || !albums[index]) return;
    
    albums[index].titel = document.getElementById("editTitel").value;
    albums[index].artiest = document.getElementById("editArtiest").value;
    albums[index].front = document.getElementById("editFront").value;
    albums[index].back = document.getElementById("editBack").value;
    albums[index].spotify = document.getElementById("editSpotify").value;
    albums[index].youtube = document.getElementById("editYouTube").value;
    
    hideForms();
    renderAlbums();
}

function searchLPs() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const filtered = albums.filter(album => 
        album.titel.toLowerCase().includes(q) || 
        album.artiest.toLowerCase().includes(q)
    );
    renderAlbums(filtered);
}

function openViewer(front, back, spotify, youtube) {
    currentFront = front;
    currentBack = back;
    currentSpotify = spotify;
    currentYouTube = youtube;
    
    document.getElementById("viewerImg").src = front;
    document.getElementById("viewer").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showFront() { document.getElementById("viewerImg").src = currentFront; }
function showBack() { document.getElementById("viewerImg").src = currentBack; }
function openSpotify() { if (currentSpotify) window.open(currentSpotify, "_blank"); }
function openYouTube() { if (currentYouTube) window.open(currentYouTube, "_blank"); }
function closeViewer() { document.getElementById("viewer").style.display = "none"; }

renderAlbums();
</script>
</body>
</html>
