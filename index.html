<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Digitale Platenkast</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 { text-align: center; }
        
        /* MENU */
        .menu {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .menu button {
            padding: 10px 15px;
            border: none;
            background: #555;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .menu button:hover { background: #777; }
        
        /* FORMULIEREN */
        .form {
            display: none;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .form input, .form select {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            border-radius: 4px;
            border: none;
            box-sizing: border-box;
        }
        .form button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form button:hover { background: #555; }
        
        /* ZOEKFUNCTIE */
        #searchBox {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        /* GROTE VIEWER */
        #viewer {
            width: 350px;
            margin: 20px auto;
            text-align: center;
            display: none;
        }
        #viewer img {
            width: 100%;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #viewer button {
            margin: 10px 5px;
            padding: 10px 15px;
            background: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #viewer button:hover { background: #666; }
        
        /* PLANKEN */
        #platenkast {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 30px;
        }
        .plank {
            display: flex;
            gap: 20px;
            padding: 15px;
            background-color: #2d251e;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        .album-kaart {
            text-align: center;
            cursor: pointer;
            width: 140px;
        }
        .album-kaart img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .titel { margin-top: 8px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artiest { font-size: 0.9em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <h1>🎵 Mijn LP Collectie</h1>

    <!-- MENU -->
    <nav class="menu">
        <button onclick="showForm('addForm')">LP toevoegen</button>
        <button onclick="showForm('removeForm')">LP verwijderen</button>
        <button onclick="showForm('editForm')">LP wijzigen</button>
    </nav>

    <!-- ZOEKFUNCTIE -->
    <input id="searchBox" placeholder="Zoek op titel of artiest..." onkeyup="searchLPs()">

    <!-- GROTE VIEWER -->
    <section id="viewer">
        <img id="viewerImg" src="" alt="Geselecteerde LP hoes">
        <div>
            <button onclick="showFront()">Voorkant</button>
            <button onclick="showBack()">Achterkant</button>
            <button onclick="openSpotify()">Spotify</button>
            <button onclick="openYouTube()">YouTube</button>
            <button onclick="closeViewer()">Sluiten</button>
        </div>
    </section>

    <!-- LP TOEVOEGEN -->
    <div id="addForm" class="form">
        <h3>Nieuwe LP toevoegen</h3>
        <input id="titel" placeholder="Titel van album">
        <input id="artiest" placeholder="Artiest (jaar)">
        <input id="front" placeholder="Bestandsnaam voorkant (bijv. nieuwlp-front.jpg)">
        <input id="back" placeholder="Bestandsnaam achterkant (bijv. nieuwlp-back.jpg)">
        <input id="spotify" placeholder="Spotify link (optioneel)">
        <input id="youtube" placeholder="YouTube link (optioneel)">
        <button onclick="addLP()">Toevoegen</button>
    </div>

    <!-- LP VERWIJDEREN -->
    <div id="removeForm" class="form">
        <h3>LP verwijderen</h3>
        <select id="removeSelect"></select>
        <button onclick="removeLP()">Verwijderen</button>
    </div>

    <!-- LP WIJZIGEN -->
    <div id="editForm" class="form">
        <h3>LP wijzigen</h3>
        <select id="editSelect" onchange="loadEditFields()"></select>
        <input id="editTitel" placeholder="Nieuwe titel">
        <input id="editArtiest" placeholder="Nieuwe artiest (jaar)">
        <input id="editFront" placeholder="Nieuwe voorkant-bestandsnaam">
        <input id="editBack" placeholder="Nieuwe achterkant-bestandsnaam">
        <input id="editSpotify" placeholder="Nieuwe Spotify link">
        <input id="editYouTube" placeholder="Nieuwe YouTube link">
        <button onclick="editLP()">Opslaan</button>
    </div>

    <!-- PLATENKAST -->
    <main id="platenkast"></main>
    <script>
let albums = [
    {
        titel: "Abbey Road",
        artiest: "The Beatles (1969)",
        front: "abbeyroad-front.jpg",
        back: "abbeyroad-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    },
    {
        titel: "The Dark Side of the Moon",
        artiest: "Pink Floyd (1973)",
        front: "darkside-front.jpg",
        back: "darkside-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    },
    {
        titel: "Thriller",
        artiest: "Michael Jackson (1982)",
        front: "thriller-front.jpg",
        back: "thriller-back.jpg",
        spotify: "https://spotify.com",
        youtube: "https://youtube.com"
    }
];

let currentFront = "";
let currentBack = "";
let currentSpotify = "";
let currentYouTube = "";

function renderAlbums(filtered = null) {
    const kast = document.getElementById("platenkast");
    kast.innerHTML = "";
    const list = filtered || albums;

    for (let i = 0; i < list.length; i += 3) {
        let plank = document.createElement("div");
        plank.className = "plank";
        
        list.slice(i, i + 3).forEach(album => {
            plank.innerHTML += `
                <div class="album-kaart" onclick="openViewer('${album.front}', '${album.back}', '${album.spotify}', '${album.youtube}')">
                    <img src="${album.front}" alt="Hoes van ${album.titel}">
                    <div class="titel" title="${album.titel}">${album.titel}</div>
                    <div class="artiest" title="${album.artiest}">${album.artiest}</div>
                </div>
            `;
        });
        kast.appendChild(plank);
    }
    updateSelectLists();
}

function updateSelectLists() {
    const removeSel = document.getElementById("removeSelect");
    const editSel = document.getElementById("editSelect");
    removeSel.innerHTML = "";
    editSel.innerHTML = "";
    
    albums.forEach((album, index) => {
        removeSel.innerHTML += `<option value="${index}">${album.titel}</option>`;
        editSel.innerHTML += `<option value="${index}">${album.titel}</option>`;
    });
}

function showForm(formId) {
    hideForms();
    document.getElementById(formId).style.display = "block";
    if(formId === 'editForm') {
        loadEditFields();
    }
}

function hideForms() {
    document.getElementById("addForm").style.display = "none";
    document.getElementById("removeForm").style.display = "none";
    document.getElementById("editForm").style.display = "none";
}

function addLP() {
    const titelVal = document.getElementById("titel").value;
    const artiestVal = document.getElementById("artiest").value;
    const frontVal = document.getElementById("front").value;
    
    if(!titelVal || !artiestVal || !frontVal) {
        alert("Vul ten minste een titel, artiest en voorkant in!");
        return;
    }

    albums.push({
        titel: titelVal,
        artiest: artiestVal,
        front: frontVal,
        back: document.getElementById("back").value || frontVal,
        spotify: document.getElementById("spotify").value,
        youtube: document.getElementById("youtube").value
    });
    
    document.getElementById("titel").value = "";
    document.getElementById("artiest").value = "";
    document.getElementById("front").value = "";
    document.getElementById("back").value = "";
    document.getElementById("spotify").value = "";
    document.getElementById("youtube").value = "";
    
    hideForms();
    renderAlbums();
}

function removeLP() {
    const index = document.getElementById("removeSelect").value;
    if(index === "") return;
    
    albums.splice(index, 1);
    hideForms();
    renderAlbums();
}

function loadEditFields() {
    const index = document.getElementById("editSelect").value;
    if (index === "" || !albums[index]) return;
    
    const album = albums[index];
    document.getElementById("editTitel").value = album.titel;
    document.getElementById("editArtiest").value = album.artiest;
    document.getElementById("editFront").value = album.front;
    document.getElementById("editBack").value = album.back;
    document.getElementById("editSpotify").value = album.spotify;
    document.getElementById("editYouTube").value = album.youtube;
}

function editLP() {
    const index = document.getElementById("editSelect").value;
    if (index === "" || !albums[index]) return;
    
    albums[index].titel = document.getElementById("editTitel").value;
    albums[index].artiest = document.getElementById("editArtiest").value;
    albums[index].front = document.getElementById("editFront").value;
    albums[index].back = document.getElementById("editBack").value;
    albums[index].spotify = document.getElementById("editSpotify").value;
    albums[index].youtube = document.getElementById("editYouTube").value;
    
    hideForms();
    renderAlbums();
}

function searchLPs() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const filtered = albums.filter(album => 
        album.titel.toLowerCase().includes(q) || 
        album.artiest.toLowerCase().includes(q)
    );
    renderAlbums(filtered);
}

function openViewer(front, back, spotify, youtube) {
    currentFront = front;
    currentBack = back;
    currentSpotify = spotify;
    currentYouTube = youtube;
    
    document.getElementById("viewerImg").src = front;
    document.getElementById("viewer").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showFront() { document.getElementById("viewerImg").src = currentFront; }
function showBack() { document.getElementById("viewerImg").src = currentBack; }
function openSpotify() { if (currentSpotify) window.open(currentSpotify, "_blank"); }
function openYouTube() { if (currentYouTube) window.open(currentYouTube, "_blank"); }
function closeViewer() { document.getElementById("viewer").style.display = "none"; }

renderAlbums();
</script>
</body>
</html>
